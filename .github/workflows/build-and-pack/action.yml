name: 'Build, Pack & Upload'
description: 'Compiles the kernel with ccache, packages into AnyKernel3 or MKBOOTIMG, and uploads release artifacts.'

runs:
  using: 'composite'
  steps:
    - name: ⚡ Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: build-kernel-${{ env.DEVICE_NAME }}${{ env.UPLOADNAME }}
        max-size: 5G

    - name: 🚀 Compile Kernel
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/device_kernel"

        # 1. Compiler Toolchain & Flags Dispatch
        if [ -n "${{ env.GCC_64 }}" ]; then
          export "${{ env.GCC_64 }}"
        fi
        if [ -n "${{ env.GCC_32 }}" ]; then
          export "${{ env.GCC_32 }}"
        fi

        if [ -n "${{ env.CLANG_SOURCE }}" ]; then
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          MAKE_OPTS=(CC="ccache clang" O=out ARCH="${{ env.KERNEL_ARCH }}" ${{ env.CUSTOM_CMDS }} ${{ env.EXTRA_CMDS }})
        else
          MAKE_OPTS=(O=out ARCH="${{ env.KERNEL_ARCH }}")
        fi

        # 2. Defconfig Reading
        echo "========================"
        echo "=    Read Defconfig    ="
        echo "========================"
        make "${MAKE_OPTS[@]}" ${{ env.DEFCONFIG_NAME }}

        # 3. Additional Config Merging
        if [ "${{ env.BUILD_OTHER_CONFIG }}" == "true" ]; then
          echo "================="
          echo "=Merge Config(s)="
          echo "================="
          IFS=',' read -ra MERGE_CONFIG_FILES <<< "${{ env.MERGE_CONFIG_FILES }}"
          for FILE in "${MERGE_CONFIG_FILES[@]}"; do
            ./scripts/kconfig/merge_config.sh -O out/ -m out/.config "arch/$KERNEL_ARCH/configs/$FILE"
          done
          make "${MAKE_OPTS[@]}" olddefconfig
        fi

        if [ "${{ env.DROIDSPACES_ENABLE }}" == "true" ]; then
          echo "================="
          echo "=  Droidspaces  ="
          echo "================="
          ./scripts/kconfig/merge_config.sh -O out/ -m out/.config "arch/$KERNEL_ARCH/configs/droidspaces.config"
          make "${MAKE_OPTS[@]}" olddefconfig
        fi

        # 4. KPM Inline Detection
        if [ "${{ env.KPM_ENABLE }}" == "true" ] && [ "${{ env.KPM_INLINE }}" == "true" ]; then
          if grep -q "CONFIG_KALLSYMS_ALL=y" "out/.config"; then
            sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' out/.config
            echo "[+] Enabled KPM."
          fi
        fi

        # 5. Kernel Compilation
        echo "======================"
        echo "=   Execute Build    ="
        echo "======================"
        if [ "${{ env.BASEBAND_GUARD_ENABLE }}" == "true" ]; then
          make -j$(nproc --all) "${MAKE_OPTS[@]}" security/selinux/
          echo "[+] Pre-built SELinux done."
        fi

        make -j$(nproc --all) "${MAKE_OPTS[@]}" 2>&1 | tee error.log

    - name: 🔍 Analyze Compile Error
      if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/device_kernel"
        if [ -f "/tmp/Bin/check_error.sh" ]; then
          cp /tmp/Bin/check_error.sh ./ && bash check_error.sh
        fi
        if [ -f "/tmp/Bin/pack_error_files.sh" ]; then
          cp /tmp/Bin/pack_error_files.sh ./ && bash pack_error_files.sh
        fi

    - name: 📦 Packaging Process (AnyKernel3 / MKBOOTIMG)
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"
        TIME=$(date +"%Y%m%d%H%M%S")

        # =========================================================================
        # Case A: AnyKernel3 Packaging
        # =========================================================================
        if [ "${{ env.PACK_METHOD }}" == "AnyKernel3" ]; then
          AK3_DIR="$GITHUB_WORKSPACE/device_kernel/AnyKernel3"
          mkdir -p "$AK3_DIR"

          # Automated discovery and injection of device-specific anykernel.sh
          if [ -n "${{ env.SUSFS_FOLDER_FIXED }}" ] && [ -f "$GITHUB_WORKSPACE/${{ env.SUSFS_FOLDER_FIXED }}/anykernel.sh" ]; then
            cp -f "$GITHUB_WORKSPACE/${{ env.SUSFS_FOLDER_FIXED }}/anykernel.sh" "$AK3_DIR/anykernel.sh"
            echo "[+] Applied anykernel.sh from local folder: ${{ env.SUSFS_FOLDER_FIXED }}"
          elif [ -n "${{ env.DEVICE_FOLDER }}" ] && [ -f "$GITHUB_WORKSPACE/${{ env.DEVICE_FOLDER }}/anykernel.sh" ]; then
            cp -f "$GITHUB_WORKSPACE/${{ env.DEVICE_FOLDER }}/anykernel.sh" "$AK3_DIR/anykernel.sh"
            echo "[+] Applied anykernel.sh from device folder: ${{ env.DEVICE_FOLDER }}"
          elif [ -n "${{ env.SUSFS_FOLDER_FIXED }}" ] && [ -f "$GITHUB_WORKSPACE/device_kernel/NonGKI_Kernel_Patches/${{ env.SUSFS_FOLDER_FIXED }}/anykernel.sh" ]; then
            cp -f "$GITHUB_WORKSPACE/device_kernel/NonGKI_Kernel_Patches/${{ env.SUSFS_FOLDER_FIXED }}/anykernel.sh" "$AK3_DIR/anykernel.sh"
            echo "[+] Applied anykernel.sh from NonGKI_Kernel_Patches."
          elif [[ "${{ env.AK3_SOURCE }}" == *"osm0sis"* ]]; then
            sed -i -e "s/BLOCK=.*/BLOCK=auto;/" \
                   -e "s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/" \
                   -e "s/device.name1=.*/device.name1=${{ env.DEVICE_CODENAME }}/" \
                   -e "s/do.devicecheck=1/do.devicecheck=0/" "$AK3_DIR/anykernel.sh"
          fi

          mkdir -p "$AK3_DIR/tmp"

          # Stage Kernel Image
          if [ -f "$IMAGE_DIR/Image.gz-dtb" ]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" "$AK3_DIR/"
            echo "Found Image.gz-dtb!"
          elif [ -f "$IMAGE_DIR/Image.gz" ]; then
            cp -fp "$IMAGE_DIR/Image.gz" "$AK3_DIR/"
            echo "Found Image.gz!"
          elif [ -f "$IMAGE_DIR/Image" ]; then
            cp -fp "$IMAGE_DIR/Image" "$AK3_DIR/"
            echo "Found Image!"
          fi

          # Stage DTBO Image
          if [ -f "$IMAGE_DIR/dtbo.img" ]; then
            cp -fp "$IMAGE_DIR/dtbo.img" "$AK3_DIR/"
            echo "Found dtbo.img!"
          fi

          # Stage DTB Image
          if [ -f "$IMAGE_DIR/dtb.img" ]; then
            cp -fp "$IMAGE_DIR/dtb.img" "$AK3_DIR/dtb"
            echo "Found dtb.img!"
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            cp -fp "$IMAGE_DIR/dtb" "$AK3_DIR/dtb"
            echo "Found dtb!"
          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1>/dev/null 2>&1; then
              cat $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb > "$AK3_DIR/dtb"
            elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1>/dev/null 2>&1; then
              cat $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb > "$AK3_DIR/dtb"
            fi
            echo "[+] Concatenated DTB generated."
          fi

          # Stage Kernel Modules if enabled
          if [ "${{ env.PACK_KMODULES }}" == "true" ]; then
            mkdir -p "$AK3_DIR/modules/vendor/lib/modules"
            find "$GITHUB_WORKSPACE/device_kernel/out" -name '*.ko' -exec cp -f {} "$AK3_DIR/modules/vendor/lib/modules/" \;
            echo "[+] Kernel modules staged."
          fi

          # Compress final AnyKernel3 archive
          OUTPUT_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          cd "$AK3_DIR"
          7za a -mx9 "$GITHUB_WORKSPACE/$OUTPUT_ZIP" * -x!tmp -x!.git
          cd "$GITHUB_WORKSPACE"
          echo "PACK_NAME=$OUTPUT_ZIP" >> $GITHUB_ENV
          echo "[+] Successfully created AnyKernel3 package: $OUTPUT_ZIP"

        # =========================================================================
        # Case B: MKBOOTIMG Packaging
        # =========================================================================
        elif [ "${{ env.PACK_METHOD }}" == "MKBOOTIMG" ]; then
          BOOT_TOOLS="$GITHUB_WORKSPACE/mkboottools"
          FORMAT_MKBOOTIMG=$("$BOOT_TOOLS/unpack_bootimg.py" --boot_img "boot_source_${{ env.DEVICE_NAME }}.img" --format mkbootimg)
          "$BOOT_TOOLS/unpack_bootimg.py" --boot_img "boot_source_${{ env.DEVICE_NAME }}.img"

          if [ -f "$IMAGE_DIR/Image.gz-dtb" ]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" out/kernel
          elif [ -f "$IMAGE_DIR/Image.gz" ]; then
            cp -fp "$IMAGE_DIR/Image.gz" out/kernel
          elif [ -f "$IMAGE_DIR/Image" ]; then
            cp -fp "$IMAGE_DIR/Image" out/kernel
          fi

          if [ -f "$IMAGE_DIR/dtb.img" ]; then
            cp -fp "$IMAGE_DIR/dtb.img" out/dtb
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            cp -fp "$IMAGE_DIR/dtb" out/dtb
          fi

          OUTPUT_IMG="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-boot.img"
          eval "$BOOT_TOOLS/mkbootimg.py $FORMAT_MKBOOTIMG -o $OUTPUT_IMG"
          echo "PACK_NAME=$OUTPUT_IMG" >> $GITHUB_ENV
          echo "[+] Successfully created Boot Image: $OUTPUT_IMG"
        fi

    - name: ✏️ Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          ${{ env.PACK_NAME }}
        archive: false

    - name: ⚠️ Upload Error Log on Failure
      if: ${{ failure() && env.BUILD_DEBUGGER == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: compile_error_files
        path: |
          device_kernel/error.log
          device_kernel/error_files.zip
