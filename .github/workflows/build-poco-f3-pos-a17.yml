name: Build Poco F3 (PixelOS A17)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "poco_f3"
  DEVICE_CODENAME: "alioth"

  # Build commands: pure Clang/LLVM toolchain without GCC cross-compilers
  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"

  # Kernel source
  KERNEL_SOURCE: "https://github.com/NS-6/android_kernel_xiaomi_sm8250.git"
  KERNEL_BRANCH: "seventeen"

  # Clang toolchain: POS-A17 uses AOSP Clang 22.0.2 / clang-r596125
  CLANG_SOURCE: "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r596125-15682573/clang-r596125.tar.gz"
  CLANG_BRANCH: ""

  # GCC toolchain
  GCC_GNU: false
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  # Defconfig with 3-way merge
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/sm8250-common.config,vendor/xiaomi/alioth.config"

  # KernelSU: ReSukiSU with SuSFS
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"
  KERNELSU_METHOD: "shell"

  # SuSFS, Secondary patch, hook
  SUSFS_ENABLE: "true"
  SUSFS_FIXED: "true"
  PATCHES_SOURCE: "NS-6/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"
  SUSFS_FOLDER_FIXED: "alioth_pixelos_a17"
  SUSFS_PATCH_FIXED: "susfs_4.19_fixed"
  HOOK_METHOD: "inline"

  # Boot, DTB/DTBO
  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  GENERATE_DTB: "false"
  GENERATE_CHIP: ""

  # Packaging: AnyKernel3 zip
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  ROM_TEXT: "pixelos_a17"

  # Kernel Patches
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "true"
  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  # Kernel Patch Manager (KPM)
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  # Debugging & Optimization
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  FREE_MORE_SPACE: "false"

  # Runner setup
  PYTHON_VERSION: "3"

jobs:
  build-kernel:
    name: Poco F3 (PixelOS A17)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files