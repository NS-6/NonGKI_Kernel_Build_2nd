name: 'Set up the system environment for compilation.'

runs:
  using: 'composite'
  steps:
      - name: Output System OS
        shell: bash
        run: |
          title() {
              echo -e "\033[1;36m"
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                         $1                         ║"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              echo -e "\033[1;36m"
          }

          footer(){
              echo -e "\033[1;36m"
              echo "╔════════════════════════════════════════════════════════════════════╗"
              echo "║                                                                    ║"
              echo "╚════════════════════════════════════════════════════════════════════╝"
              echo -e "\033[1;36m"
          }

          context() {
              echo -e "\033[0m $1: \033[1;37m$2\033[0m"
          }

          . /etc/os-release

          title "System Information"
          context "OS" "$PRETTY_NAME"
          context "User" "$(whoami)"
          context "Current Folder" "$(pwd)"
          context "Shell" "$SHELL"

          footer

      - name: Check System OS
        shell: bash
        run: |
          . /etc/os-release

          if [ "$ID" = "ubuntu" ]; then
              if [ "$VERSION_ID" = "20.04" ]; then
                  echo "SYSTEM_VERSION=oldest" >> $GITHUB_ENV
              elif [ "$VERSION_ID" = "22.04" ]; then
                  echo "SYSTEM_VERSION=older" >> $GITHUB_ENV
              elif [ "$VERSION_ID" = "24.04" ]; then
                  echo "SYSTEM_VERSION=newer" >> $GITHUB_ENV
              else
                  echo "[-] Not supported ubuntu version: $VERSION_ID."
                  false
              fi
          elif [ "$ID" = "arch" ]; then
              echo "SYSTEM_VERSION=arch" >> $GITHUB_ENV
          else
              echo "[-] Not supported system os: $PRETTY_NAME."
              false
          fi

      - name: Free Disk Space (Ubuntu)
        if: env.FREE_MORE_SPACE == 'true' && env.SYSTEM_VERSION == 'newer' || env.SYSTEM_VERSION == 'older'
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          preinstalled-runtimes: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Remove useless tools
        if: env.SYSTEM_VERSION == 'newer' || env.SYSTEM_VERSION == 'older'
        shell: bash
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Move Patch and Tools
        shell: bash
        run: |
          # Move patch folder to tmp
          mv $GITHUB_WORKSPACE/Patches /tmp/

          # Set curlx
          mv $GITHUB_WORKSPACE/Bin /tmp/
          chmod 777 /tmp/Bin/curlx.sh
          echo "CURLX=/tmp/Bin/curlx.sh" >> $GITHUB_ENV

          # Copy Shell
          cp /tmp/Bin/found_gcc.sh ./

      - name: Install necessary packages
        shell: bash
        run: |
          SUDO=$(command -v sudo || true)

          # =========================================================================
          # 1. Operating System Base Packages & Dependencies
          # =========================================================================
          if [ "${{ env.SYSTEM_VERSION }}" == "newer" ] || [ "${{ env.SYSTEM_VERSION }}" == "older" ] || [ "${{ env.SYSTEM_VERSION }}" == "oldest" ]; then
            # Set non-interactive timezone to prevent tzdata configuration prompts
            TZ=America/Los_Angeles
            $SUDO ln -snf "/usr/share/zoneinfo/$TZ" /etc/localtime
            echo "$TZ" | $SUDO tee /etc/timezone >/dev/null
            echo "[+] Timezone has been set."

            echo "::group::[+] Starting install base packages..."
            $SUDO apt-get update

            # Core packages shared across all Ubuntu versions (20.04, 22.04, 24.04)
            $SUDO apt-get install -y \
              git ccache automake flex lzop bison gperf build-essential zip curl \
              zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
              libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make \
              optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom \
              libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev \
              lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio \
              liblz4-tool lz4 libz3-4 wget p7zip p7zip-full

            # Ubuntu version-specific packages
            if [ "${{ env.SYSTEM_VERSION }}" == "newer" ]; then
              # Ubuntu 24.04 (Noble): libtinfo5 was dropped from official repos, install via deb package
              $SUDO apt-get install -y zstd binutils gcc g++
              ${{ env.CURLX }} https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb libtinfo5.deb
              $SUDO apt-get install -y ./libtinfo5.deb
              rm -f libtinfo5.deb
            else
              # Ubuntu 20.04 (Focal) & 22.04 (Jammy)
              $SUDO apt-get install -y lib32ncurses5-dev libtinfo5
            fi
            echo "::endgroup::"
            echo "[+] The base packages is installed."

            # -------------------------------------------------------------
            # Install Coccinelle (Semantic patch tool required for kernel)
            # Built from source for Ubuntu
            # -------------------------------------------------------------
            echo "::group::[+] Starting build coccinelle..."
            $SUDO apt-get install -y pkg-config ocaml-nox ocaml-findlib autoconf libpcre3-dev python3-dev menhir libparmap-ocaml-dev libpcre-ocaml-dev
            ${{ env.CURLX }} "https://coccinelle.gitlabpages.inria.fr/website/distrib/coccinelle-1.3.tar.gz" "coccinelle.tar.gz"
            tar zxf coccinelle.tar.gz
            cd coccinelle-1.3
            ./autogen
            ./configure
            make
            $SUDO make install
            cd "$GITHUB_WORKSPACE"
            rm -rf coccinelle.tar.gz coccinelle-1.3
            echo "::endgroup::"
            echo "[+] Coccinelle is installed."

            # -------------------------------------------------------------
            # Python Environment Configuration (Ubuntu)
            # -------------------------------------------------------------
            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
              $SUDO apt-get install -y python3
              $SUDO rm -rf /usr/bin/python
              $SUDO ln -s /usr/bin/python3 /usr/bin/python
              echo "[+] Python version: $(python -V)"

            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
              if [ "${{ env.SYSTEM_VERSION }}" == "newer" ]; then
                # Ubuntu 24.04 removed Python 2 packages entirely; build from source if requested
                echo "::group::[+] Starting build Python 2..."
                wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
                tar -xvf Python-2.7.18.tgz
                cd Python-2.7.18
                ./configure
                make -j$(nproc)
                $SUDO make install
                curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
                $SUDO python2.7 get-pip.py
                $SUDO update-alternatives --install /usr/bin/python python /usr/local/bin/python2.7 1
                cd "$GITHUB_WORKSPACE"
                rm -rf Python-2.7.18 Python-2.7.18.tgz get-pip.py
                echo "::endgroup::"
                echo "[+] Python version: $(python -V)"
              else
                # Ubuntu 20.04 & 22.04: Python 2 is available via apt
                $SUDO apt-get install -y python2
                $SUDO rm -rf /usr/bin/python
                $SUDO ln -s /usr/bin/python2.7 /usr/bin/python
                echo "[+] Python version: $(python -V)"
              fi

            else
              echo "[-] You need choose a valid python version!"
              false
            fi

          elif [ "${{ env.SYSTEM_VERSION }}" == "arch" ]; then
            # =========================================================================
            # Arch Linux Environment
            # =========================================================================
            echo "::group::[+] Starting install base packages..."
            pacman-key --init
            pacman -Syyu --noconfirm
            pacman -S git base-devel systemd wget rustup curl patch ccache automake flex lzop bison gperf zip curl bzip2 squashfs-tools pngcrush schedtool make optipng maven pwgen minicom bc unzip 7zip zstd binutils gcc wget which libxml2-legacy dtc cpio lz4 z3 --noconfirm
            echo "::endgroup::"
            echo "[+] The base packages is installed."

            # Install Coccinelle via ArchLinuxCN community repository
            echo "::group::[+] Starting install coccinelle..."
            echo -e "\n[archlinuxcn]\nServer = https://repo.archlinuxcn.org/\$arch" >> /etc/pacman.conf
            pacman -Syy
            pacman -S archlinuxcn-keyring --noconfirm
            pacman -S coccinelle --noconfirm
            echo "::endgroup::"
            echo "[+] Coccinelle is installed."

            # Python configuration for Arch
            if [ "${{ env.PYTHON_VERSION }}" == "3" ]; then
              pacman -S python3 --noconfirm
              rm -rf /usr/bin/python
              ln -s /usr/bin/python3 /usr/bin/python
              echo "[+] Python version: $(python -V)"

            elif [ "${{ env.PYTHON_VERSION }}" == "2" ]; then
              pacman -S python2 --noconfirm
              rm -rf /usr/bin/python
              ln -s /usr/bin/python2.7 /usr/bin/python
              echo "[+] Python version: $(python -V)"

            else
              echo "[-] You need choose a valid python version!"
              false
            fi

            # Update Rust Toolchain
            rustup default stable

          else
            echo "[-] Support is currently unavailable for the operating system you selected!"
            false
          fi

          # =========================================================================
          # 2. MKDTBO Tool Installation (Shared across all Linux distros)
          #
          # Extracts Android libufdt mkdtboimg utilities for DTBO image creation.
          # Automatically skipped if DTBO generation is not requested by the build config.
          # =========================================================================
          if [ "${{ env.NEED_DTBO }}" == "true" ]; then
            echo "::group::[+] Getting MKDTBO tool..."
            mkdir -p "$GITHUB_WORKSPACE/mkdtbo"
            cd "$GITHUB_WORKSPACE/mkdtbo"
            ${{ env.CURLX }} https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/main/utils/src.tar.gz src.tar.gz
            tar zxvf src.tar.gz
            rm -f src.tar.gz
            chmod +x "$GITHUB_WORKSPACE/mkdtbo/mkdtboimg.py"
            $SUDO ln -sfn "$GITHUB_WORKSPACE/mkdtbo/mkdtboimg.py" /usr/bin/mkdtboimg
            $SUDO ln -sfn "$GITHUB_WORKSPACE/mkdtbo/mkdtboimg.py" /usr/bin/mkdtimg
            test -x /usr/bin/mkdtimg
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
            echo "[+] MKDTBO tool is installed."
          else
            echo "[-] Need_DTBO is set to false, Skipped."
          fi

      - name: Install GNU GCC
        if: env.GCC_GNU == 'true'
        shell: bash
        run: |
          if [ "${{ env.SYSTEM_VERSION }}" == "newer" ] || [ "${{ env.SYSTEM_VERSION }}" == "older" ] || [ "${{ env.SYSTEM_VERSION }}" == "oldest" ]; then
            echo "::group::[+] Starting install GNU GCC..."
            sudo apt install binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
            sudo apt install gcc-arm-linux-gnueabi -y

            echo "GCC_64=CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
            echo "GCC_32=CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

            echo "::endgroup::"
            echo "[+] Get GNU GCC successfully."

          elif [ "${{ env.SYSTEM_VERSION }}" == "arch" ]; then
            echo "::group::[+] Starting install GNU GCC..."
            pacman -S aarch64-linux-gnu-binutils aarch64-linux-gnu-gcc aarch64-linux-gnu-linux-api-headers aarch64-linux-gnu-glibc --noconfirm
            pacman -S arm-linux-gnueabihf-binutils arm-linux-gnueabihf-gcc arm-linux-gnueabihf-linux-api-headers arm-linux-gnueabihf-glibc --noconfirm

            echo "GCC_64=CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
            echo "GCC_32=CROSS_COMPILE_ARM32=arm-linux-gnueabihf-" >> $GITHUB_ENV

            echo "::endgroup::"
            echo "[+] Get GNU GCC successfully."

          else
            echo "[-] Support is currently unavailable for the operating system you selected!"
            false

          fi

      - name: Set Compile Environment
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          # Helper to download and unpack toolchains (Git, tar.gz, tar.xz, zip)
          fetch_and_extract() {
            local url="$1"
            local branch="$2"
            local target_dir="$3"
            local archive_name="archive_${target_dir}"

            mkdir -p "$target_dir"

            # 1. Git repository clone
            if [[ "$url" == *".git" ]]; then
              echo "[+] Cloning Git repository: $url (branch: $branch)"
              git clone "$url" -b "$branch" "$target_dir" --depth=1

            # 2. Gzip-compressed tar archive (.tar.gz)
            elif [[ "$url" == *".tar.gz" ]]; then
              echo "[+] Downloading and extracting tar.gz archive..."
              ${{ env.CURLX }} "$url" "${archive_name}.tar.gz"
              tar -C "$target_dir" -zxf "${archive_name}.tar.gz"
              rm -f "${archive_name}.tar.gz"

            # 3. XZ-compressed tar archive (.tar.xz or .xz)
            # Strip components to unwrap top-level directory commonly present in GCC/Clang tarballs
            elif [[ "$url" == *".tar.xz" ]] || [[ "$url" == *".xz" ]]; then
              echo "[+] Downloading and extracting tar.xz archive..."
              ${{ env.CURLX }} "$url" "${archive_name}.tar.xz"
              tar -C "$target_dir" -xf "${archive_name}.tar.xz" --strip-components 1
              rm -f "${archive_name}.tar.xz"

            # 4. Standard zip archive (.zip)
            elif [[ "$url" == *".zip" ]]; then
              echo "[+] Downloading and extracting zip archive..."
              ${{ env.CURLX }} "$url" "${archive_name}.zip"
              unzip "${archive_name}.zip" -d "$target_dir"
              rm -f "${archive_name}.zip"

            else
              # Unrecognized archive format
              return 1
            fi
          }

          # =========================================================================
          # 1. Configure GCC (Cross-compilers: AArch64 and ARM32)
          # =========================================================================
          if [[ "${{ env.CLANG_SOURCE }}" == *proton* ]]; then
            # Proton Clang contains its own integrated GNU binutils / cross-tools
            echo "[+] Detected Proton Clang. Automatically configuring internal GCC cross-prefixes."
            echo "GCC_64=CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
            echo "GCC_32=CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

          elif [[ "${{ env.GCC_GNU }}" == "true" ]]; then
            # System GNU GCC installed in previous step
            echo "[+] Detected GNU GCC flag enabled, skipping custom GCC download."

          elif [[ -z "${{ env.GCC_64_SOURCE }}" ]] && [[ -z "${{ env.GCC_32_SOURCE }}" ]]; then
            echo "[-] GCC is not configured, Skipped."

          elif [[ -n "${{ env.GCC_64_SOURCE }}" ]] && [[ -n "${{ env.GCC_32_SOURCE }}" ]]; then
            # Download and configure 64-bit GCC (AArch64)
            echo "::group::[+] Getting GCC 64..."
            if ! fetch_and_extract "${{ env.GCC_64_SOURCE }}" "${{ env.GCC_64_BRANCH }}" "gcc-64"; then
              echo "::endgroup::"
              echo "[-] Please input a valid GCC link!"
              false
            fi
            echo "::endgroup::"
            bash found_gcc.sh GCC_64

            # Download and configure 32-bit GCC (ARM32)
            echo "::group::[+] Getting GCC 32..."
            if ! fetch_and_extract "${{ env.GCC_32_SOURCE }}" "${{ env.GCC_32_BRANCH }}" "gcc-32"; then
              echo "::endgroup::"
              echo "[-] Please input a valid GCC link!"
              false
            fi
            echo "::endgroup::"
            bash found_gcc.sh GCC_32
          fi

          # =========================================================================
          # 2. Configure Clang Toolchain
          # =========================================================================
          if [[ -z "${{ env.CLANG_SOURCE }}" ]]; then
            echo "[-] Clang is not configured, Skipped."

          else
            echo "::group::[+] Getting Clang..."

            # Case A: Antman automated toolchain manager
            if [[ "${{ env.CLANG_SOURCE }}" == *"antman" ]]; then
              echo "[+] Detected Antman toolchain manager script."
              mkdir -p clang-custom && cd clang-custom
              ${{ env.CURLX }} "${{ env.CLANG_SOURCE }}" antman
              chmod +x antman
              bash antman -S=10032024
              cd "$GITHUB_WORKSPACE"

            # Case B: Google Android Prebuilts Git repository (clang-r* directory flattening)
            elif [[ "${{ env.CLANG_SOURCE }}" == *"android.googlesource.com"* ]]; then
              echo "[+] Detected Google Android Clang prebuilts repository."
              git clone "${{ env.CLANG_SOURCE }}" -b "${{ env.CLANG_BRANCH }}" clang-custom --depth=1
              SUBDIR=$(find clang-custom -maxdepth 1 -type d -name 'clang-r*' | head -n 1)
              if [ -n "$SUBDIR" ]; then
                mv "$SUBDIR"/* clang-custom/
              fi

            # Case C: Standard archive or Git repository
            elif ! fetch_and_extract "${{ env.CLANG_SOURCE }}" "${{ env.CLANG_BRANCH }}" "clang-custom"; then
              echo "::endgroup::"
              echo "[-] Please input valid Clang link!"
              false
            fi

            echo "::endgroup::"
            echo "[+] Clang environment configured."
          fi
